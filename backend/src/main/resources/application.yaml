spring:
  application:
    name: erp-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Europe/Paris
  mvc:
    problemdetails:
      enabled: true
  flyway:
    placeholders:
      initialAdminEmail: ${APP_INITIAL_ADMIN_EMAIL}

app:
  auth:
    # Seuls les emails de ce domaine peuvent se connecter (ex. centre-social.fr)
    allowed-domain: ${APP_ALLOWED_DOMAIN}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Entra ID : https://login.microsoftonline.com/<tenant-id>/v2.0
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}
