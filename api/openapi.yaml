openapi: 3.1.0
info:
  title: ERP Plannings / Congés / Heures sup
  version: 1.0.0
  description: |
    Contrat entre le back (Spring Boot) et le front (Angular, client généré).
    Authentification : Bearer JWT (Entra ID) en prod ; en profil dev, header `X-Dev-User: <email>`.
servers:
  - url: /api
security:
  - bearerAuth: []
  - devUser: []
paths:
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Utilisateur connecté (créé en EMPLOYEE au premier login)
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Liste des utilisateurs (noms, couleurs du planning, choix de l'employé)
      responses:
        '200':
          description: Utilisateurs triés par nom puis prénom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /planning:
    get:
      operationId: getPlanning
      tags: [planning]
      summary: Horaires (journée type + heures ajoutées) et absences (en attente et acceptées) de tous les employés
      parameters:
        - name: from
          in: query
          required: true
          description: Début de période (inclus)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Fin de période (exclue). Période max 62 jours.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Planning de la période
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planning'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}/schedule:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getUserSchedule
      tags: [schedule]
      summary: Semaines type (classique, vacances) et contrat hebdomadaire d'un employé (lecture pour tous)
      responses:
        '200':
          description: Horaires de l'employé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateUserSchedule
      tags: [schedule]
      summary: Modifie les semaines type et le contrat hebdomadaire (ADMIN, ou l'employé pour lui-même)
      description: |
        ADMIN : tout employé. EMPLOYEE : sa propre semaine uniquement, sans changer son contrat (403 sinon).
        Chaque semaine type doit totaliser exactement le contrat hebdomadaire (400 sinon, avec un message indiquant
        les heures manquantes ou en trop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSchedule'
      responses:
        '200':
          description: Horaires enregistrés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /school-holiday-weeks:
    get:
      operationId: getSchoolHolidayWeeks
      tags: [schedule]
      summary: Semaines de vacances scolaires (lundis), lecture pour tous
      responses:
        '200':
          description: Lundis des semaines marquées, triés
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date
        '401':
          $ref: '#/components/responses/Unauthorized'
  /school-holiday-weeks/{weekStart}:
    parameters:
      - name: weekStart
        in: path
        required: true
        description: Lundi de la semaine, strictement à venir (400 sinon)
        schema:
          type: string
          format: date
    put:
      operationId: markSchoolHolidayWeek
      tags: [schedule]
      summary: Marque une semaine de vacances scolaires (ADMIN)
      responses:
        '204':
          description: Marquée
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: unmarkSchoolHolidayWeek
      tags: [schedule]
      summary: Retire le marquage d'une semaine de vacances scolaires (ADMIN)
      responses:
        '204':
          description: Retirée
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /special-days:
    post:
      operationId: createSpecialDay
      tags: [schedule]
      summary: Ajoute des heures à un jour, en dehors de la journée type
      description: "ADMIN : tout employé, toute date. EMPLOYEE : ses propres journées uniquement, à partir d'aujourd'hui (403 sinon pour un autre employé, 400 pour un jour passé). Une plage ne doit pas empiéter sur la journée type ni sur la pause 12:30–13:30 (400) ni sur d'autres heures ajoutées (409)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialDayInput'
      responses:
        '201':
          description: Heures ajoutées enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /special-days/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateSpecialDay
      tags: [schedule]
      summary: Modifie des heures ajoutées
      description: "ADMIN : tout employé, toute date. EMPLOYEE : ses propres journées uniquement, à partir d'aujourd'hui (403 sinon pour un autre employé, 400 pour un jour passé). Une plage ne doit pas empiéter sur la journée type ni sur la pause 12:30–13:30 (400) ni sur d'autres heures ajoutées (409)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialDayInput'
      responses:
        '200':
          description: Heures ajoutées enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteSpecialDay
      tags: [schedule]
      summary: Retire des heures ajoutées
      description: "ADMIN : tout employé, toute date. EMPLOYEE : ses propres journées uniquement, à partir d'aujourd'hui (403 sinon pour un autre employé, 400 pour un jour passé)."
      responses:
        '204':
          description: Supprimée
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/requests:
    get:
      operationId: getMyRequests
      tags: [requests]
      summary: Mes déclarations d'heures sup et mes absences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/balance:
    get:
      operationId: getMyBalance
      tags: [requests]
      summary: Mon solde d'heures sup, disponible et historique
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/overtime-requests:
    post:
      operationId: declareOvertime
      tags: [requests]
      summary: Déclarer des heures supplémentaires (PENDING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OvertimeInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/overtime-requests/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: cancelOvertime
      tags: [requests]
      summary: Annuler ma déclaration en attente
      description: "Uniquement par le demandeur (403 sinon) et si PENDING (409 sinon)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/absence-requests:
    post:
      operationId: requestAbsence
      tags: [requests]
      summary: Poser une absence (PENDING)
      description: "Posée sur le planning. Règles : à partir d'aujourd'hui, sur ses propres horaires prévus, pas de chevauchement (au quart d'heure) avec une absence PENDING/APPROVED. RECUP_HEURES_SUP refusée si heures calculées > disponible (solde − récup PENDING)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/absence-requests/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: cancelAbsence
      tags: [requests]
      summary: Supprimer mon absence (en attente ou acceptée)
      description: "Uniquement par le demandeur (403 sinon), si l'absence est PENDING ou APPROVED (409 sinon) et pas encore commencée (400 sinon). Passe au statut CANCELLED ; une récupération acceptée rend ses heures au solde."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/pending-requests:
    get:
      operationId: getPendingRequests
      tags: [admin]
      summary: Demandes en attente de tous les employés (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/overtime-requests/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: decideOvertime
      tags: [admin]
      summary: Approuver ou refuser une déclaration d'heures sup (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/absence-requests/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: decideAbsence
      tags: [admin]
      summary: Approuver ou refuser une absence (ADMIN)
      description: "409 si la demande n'est plus PENDING, ou si le solde ne couvre plus une récup à approuver."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{userId}/balance:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getUserBalance
      tags: [admin]
      summary: Solde d'heures sup d'un employé (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}/balance-adjustments:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: adjustBalance
      tags: [admin]
      summary: Ajuster le solde d'un employé (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devUser:
      type: apiKey
      in: header
      name: X-Dev-User
      description: Profil dev uniquement — email de l'utilisateur simulé.
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflit (ex. chevauchement avec des heures déjà ajoutées)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Non authentifié
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Rôle insuffisant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Role:
      type: string
      enum: [EMPLOYEE, ADMIN]
    CurrentUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
    LocalTime:
      type: string
      description: Heure locale (Europe/Paris), HH:mm
      pattern: '^\d{2}:\d{2}(:\d{2})?$'
      example: '08:30'
    TypicalDay:
      type: object
      description: Journée type, matin (fin ≤ 12:30) et après-midi (début ≥ 13:30), chacun facultatif (null). Aucun = non travaillé.
      required: [dayOfWeek]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = lundi … 7 = dimanche
        morningStart:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        morningEnd:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        afternoonStart:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        afternoonEnd:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
    UserSchedule:
      type: object
      required: [weeklyHours, days]
      properties:
        weeklyHours:
          type: number
          description: Contrat hebdomadaire en heures (pas de 0,25, max 168) ; la semaine type doit le totaliser exactement
          example: 35
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Semaine classique
          items:
            $ref: '#/components/schemas/TypicalDay'
        holidayDays:
          type: [array, 'null']
          minItems: 7
          maxItems: 7
          description: Semaine de vacances scolaires ; null = à compléter (reprend la semaine classique)
          items:
            $ref: '#/components/schemas/TypicalDay'
    SpecialDayInput:
      type: object
      description: Plage d'heures ajoutée à un jour, en dehors de la journée type.
      required: [userId, date, startTime, endTime]
      properties:
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
    SpecialDay:
      type: object
      required: [id, userId, date, startTime, endTime]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
    PlanningDay:
      type: object
      description: |
        Plage travaillée d'un employé : journée type (specialDayId null, matin et après-midi) ou heures ajoutées
        (specialDayId renseigné, plusieurs possibles).
      required: [userId, date, startTime, endTime]
      properties:
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
        specialDayId:
          type: [integer, 'null']
          format: int64
    PlanningAbsence:
      type: object
      description: |
        Absence affichée au planning, sans type ni commentaire : PENDING ou APPROVED, visible par tous. startTime/endTime null = journées entières.
      required: [id, userId, startDate, endDate, status]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Inclus
        startTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        status:
          $ref: '#/components/schemas/RequestStatus'
    Planning:
      type: object
      required: [days, absences, holidayWeeks]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/PlanningDay'
        absences:
          type: array
          items:
            $ref: '#/components/schemas/PlanningAbsence'
        holidayWeeks:
          type: array
          description: Lundis des semaines de vacances scolaires touchant la période
          items:
            type: string
            format: date
    RequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    AbsenceType:
      type: string
      enum: [RECUP_HEURES_SUP, SANS_SOLDE]
    OvertimeInput:
      type: object
      required: [date, hours, reason]
      properties:
        date:
          type: string
          format: date
        hours:
          type: number
          description: Heures > 0, au pas de 0,25 (max 24)
        reason:
          type: string
    OvertimeRequest:
      type: object
      required: [id, userId, date, hours, reason, status]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        hours:
          type: number
        reason:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        adminComment:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AbsenceInput:
      type: object
      description: |
        Absence posée sur le planning (spec §3) : plage horaire d'un seul jour (startTime + endTime, au quart d'heure,
        commençant et finissant pendant les heures prévues, pause et coupures non comptées) ou journées entières (sans heures). Le nombre d'heures est calculé par le
        serveur (heures travaillées couvertes, ou somme des heures prévues des jours travaillés).
      required: [type, startDate]
      properties:
        type:
          $ref: '#/components/schemas/AbsenceType'
        startDate:
          type: string
          format: date
        endDate:
          type: [string, 'null']
          format: date
          description: Inclus ; absent = startDate
        startTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        comment:
          type: [string, 'null']
    AbsenceRequest:
      type: object
      required: [id, userId, type, startDate, endDate, hours, status]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/AbsenceType'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        startTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        hours:
          type: number
          description: Calculé par le serveur
        comment:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/RequestStatus'
        adminComment:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    Requests:
      type: object
      required: [overtimes, absences]
      properties:
        overtimes:
          type: array
          items:
            $ref: '#/components/schemas/OvertimeRequest'
        absences:
          type: array
          items:
            $ref: '#/components/schemas/AbsenceRequest'
    DecisionInput:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        comment:
          type: [string, 'null']
    AdjustmentInput:
      type: object
      required: [hours, reason]
      properties:
        hours:
          type: number
          description: Heures signées (+ ou −), non nulles, au pas de 0,25
        reason:
          type: string
    Movement:
      type: object
      required: [date, kind, hours, label]
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          enum: [OVERTIME, RECUP, ADJUSTMENT]
        hours:
          type: number
          description: Signées (+ heures sup / ajustement positif, − récup / ajustement négatif)
        label:
          type: string
    Balance:
      type: object
      description: "solde = Σ heures sup APPROVED − Σ récup APPROVED + Σ ajustements ; disponible = solde − Σ récup PENDING"
      required: [balance, available, movements]
      properties:
        balance:
          type: number
        available:
          type: number
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
