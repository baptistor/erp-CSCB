openapi: 3.1.0
info:
  title: ERP Plannings / Congés / Heures sup
  version: 1.0.0
  description: |
    Contrat entre le back (Spring Boot) et le front (Angular, client généré).
    Authentification : Bearer JWT (Entra ID) en prod ; en profil dev, header `X-Dev-User: <email>`.
servers:
  - url: /api
security:
  - bearerAuth: []
  - devUser: []
paths:
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Utilisateur connecté (créé en EMPLOYEE au premier login)
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devUser:
      type: apiKey
      in: header
      name: X-Dev-User
      description: Profil dev uniquement — email de l'utilisateur simulé.
  responses:
    Unauthorized:
      description: Non authentifié
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Rôle insuffisant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Role:
      type: string
      enum: [EMPLOYEE, ADMIN]
    CurrentUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
